# One Alloy agent per host (own compose project): discover, collect, push.
# v1-compose syntax to match the deploy tooling. See README.md.
version: "2.4"

# Same rotation the app stack uses (deployment/*/docker-compose.yml). The daemon
# default is unlimited, and the agent is the container that has to keep reporting
# while the host fills up — an ENOSPC here tears the metrics WAL and the agent
# then loops on the torn segment instead of pushing.
x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"

services:
  alloy:
    # build (not bind-mount): config.alloy reaches the remote daemon via the context
    build:
      context: .
      args:
        ALLOY_VERSION: ${ALLOY_VERSION}
    image: soldevelo-monitoring-alloy:${ALLOY_VERSION}
    restart: unless-stopped
    # Pins `instance` on the agent's own exporter targets. Without it the
    # container ID is used, so rebuilding the agent orphans every series it
    # produced and AgentAbsent fires for a routine upgrade.
    hostname: ${TARGET_NAME}
    command:
      - run
      - /etc/alloy               # config.alloy + malawi.alloy, merged
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    environment:
      APP: ${APP}
      DEPLOYMENT: ${DEPLOYMENT}
      ENVIRONMENT: ${ENVIRONMENT}
      TARGET_NAME: ${TARGET_NAME}
      INGEST_METRICS_URL: ${INGEST_METRICS_URL}
      INGEST_LOGS_URL: ${INGEST_LOGS_URL}
      INGEST_TOKEN: ${INGEST_TOKEN}
      LOG_DROP_SERVICES: ${LOG_DROP_SERVICES}
    privileged: true          # cAdvisor cgroup/device access
    pid: host                 # unix exporter sees host processes
    volumes:
      # config is baked into the image (build:), not mounted here
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # unix (node) exporter
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # cAdvisor
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - alloy-data:/var/lib/alloy
    devices:
      - /dev/kmsg
    networks:
      # join the app network so Alloy can reach container IPs to scrape them
      - appnet
    logging: *default-logging

  # postgres_exporter → RDS; Alloy discovers and scrapes it via the labels
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN}
    labels:
      monitoring.scrape: "true"
      monitoring.port: "9187"
      monitoring.service: "postgres"
    networks:
      - appnet
    logging: *default-logging

volumes:
  alloy-data:

networks:
  appnet:
    external:
      name: ${APP_NETWORK}
