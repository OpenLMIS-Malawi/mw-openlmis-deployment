# One Grafana Alloy agent for an OpenLMIS Malawi host: discover, collect, push.
# Deployed as its own compose project (separate from the app stack) against the
# environment's Docker daemon. Config in config.alloy; identity/secrets in .env.
# Written for docker-compose v1 (version 2.x schema) to match the deploy tooling.
# Keep COMPOSE_PROJECT_NAME=soldevelo-monitoring-agents (see .env) so Alloy drops
# its own logs (self-loop guard in config.alloy).
version: "2.4"

services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    environment:
      APP: ${APP}
      DEPLOYMENT: ${DEPLOYMENT}
      ENVIRONMENT: ${ENVIRONMENT}
      TARGET_NAME: ${TARGET_NAME}
      INGEST_METRICS_URL: ${INGEST_METRICS_URL}
      INGEST_LOGS_URL: ${INGEST_LOGS_URL}
      INGEST_TOKEN: ${INGEST_TOKEN}
    privileged: true          # cAdvisor cgroup/device access
    pid: host                 # unix exporter sees host processes
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # unix (node) exporter
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # cAdvisor
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - alloy-data:/var/lib/alloy
    devices:
      - /dev/kmsg
    networks:
      # join the app network so Alloy can reach container IPs to scrape them
      - appnet

volumes:
  alloy-data:

networks:
  appnet:
    external:
      name: ${APP_NETWORK}
